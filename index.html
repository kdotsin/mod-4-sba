<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
</head>
<body>
    <div id="input-container">
        <label for="tsk-name">Task <input type="text" id="tsk-name"></label>
        <label for="category-name">Category <input type="text" id="category-name"></label>
        <label for="deadline">Deadline <input type="date" id="deadline"></label>
        <label for="status-input">
            <select name="status" id="status-input">
                <option value="" disabled selected>Select Status</option>
                <option value="in-progress">In Progress</option>
                <option value="completed">Completed</option>
                <option value="not-started">Not Started</option>
            </select>
        </label>
        <select name="filter" id="filter-options">
            <option value="" disabled selected>Select Filter</option>
            <option value="in-progress">In Progress</option>
            <option value="completed">Completed</option>
            <option value="not-started">Not Started</option>
        </select>
        <button id="add-btn">Add Task</button>
    </div>
    <div id="list-container">

    </div>
</body>
</html>
